<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sóc Nâu Review</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#0b0b0f;
      color:white;
      font-family:Arial,sans-serif;
      padding-bottom:85px;
    }
    header{
      padding:22px 18px 12px;
    }
    .brand{
      font-size:26px;
      font-weight:800;
    }
    .brand span{color:#f5b942}
    .search{
      width:100%;
      margin-top:16px;
      padding:14px 16px;
      border:0;
      border-radius:14px;
      background:#1b1b22;
      color:white;
      font-size:16px;
    }
    section{padding:8px 18px}
    h2{font-size:19px;margin:16px 0 12px}
    .hero{
      height:190px;
      border-radius:18px;
      padding:20px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:linear-gradient(135deg,#5b3016,#181821);
    }
    .hero h1{margin:0;font-size:24px}
    .hero p{margin:7px 0 0;color:#ddd}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .movie{
      background:#18181f;
      border-radius:15px;
      overflow:hidden;
    }
    .poster{
      height:180px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:45px;
      background:linear-gradient(145deg,#37211b,#27283d);
    }
    .info{padding:11px}
    .info b{font-size:14px}
    .info small{
      display:block;
      margin-top:6px;
      color:#aaa;
    }
    nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:72px;
      background:#15151b;
      display:flex;
      justify-content:space-around;
      align-items:center;
      border-top:1px solid #292932;
    }
    nav div{
      text-align:center;
      color:#aaa;
      font-size:12px;
    }
    nav .active{color:#f5b942}
    nav b{
      display:block;
      font-size:21px;
      margin-bottom:4px;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">🐿️ SÓC NÂU <span>REVIEW</span></div>
  <input class="search" placeholder="🔎 Tìm kiếm phim...">
</header>

<section>
  <h2>🔥 Phim nổi bật</h2>

  <div class="hero">
    <h1>Xuyên Về Thập Niên 60</h1>
    <p>Sở hữu không gian thần bí</p>
  </div>
</section>

<section>
  <h2>🆕 Mới cập nhật</h2>

  <div class="grid">

    <div class="movie">
      <div class="poster">🎬</div>
      <div class="info">
        <b>Xuyên Về Năm 1960</b>
        <small>Tập 06</small>
      </div>
    </div>

    <div class="movie">
      <div class="poster">🎞️</div>
      <div class="info">
        <b>Không Giấu Thân Phận</b>
        <small>Tập 07</small>
      </div>
    </div>

    <div class="movie">
      <div class="poster">🍿</div>
      <div class="info">
        <b>Định Mệnh Trở Lại</b>
        <small>Tập 03</small>
      </div>
    </div>

    <div class="movie">
      <div class="poster">👑</div>
      <div class="info">
        <b>Trở Lại Đỉnh Cao</b>
        <small>12 tập</small>
      </div>
    </div>

  </div>
</section>

<nav>
  <div class="active"><b>⌂</b>Trang chủ</div>
  <div><b>⌕</b>Khám phá</div>
  <div><b>♟</b>Cộng đồng</div>
  <div><b>●</b>Cá nhân</div>
</nav>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }
</script>

</body>
</html>
